tools:
  - name: list_preset_resources
    description: >-
      List generator (.sbsar) and smart-material (.spsm) preset resources available on the Painter shelf, in the project, or in the session. Read-only discovery; returns stable resource URLs for import and application.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          maxLength: 256
          description: Optional case-insensitive search term for preset names.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
          description: Maximum number of preset resources to return.
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/list_preset_resources.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-success:
        - painter_project__import_resource
        - painter_project__apply_smart_material
      on-failure:
        - painter_project__search_resources
  - name: inspect_preset_parameters
    description: >-
      Inspect the exposed parameters of an applied Painter preset instance (generator effect or smart material), reporting host parameter capabilities and current JSON-safe values by name. Read-only.
    input_schema:
      type: object
      additionalProperties: false
      required: [node_uid]
      properties:
        node_uid:
          type: integer
          minimum: 0
          description: UID of the applied preset node, as returned by list_layer_stack, apply_smart_material, or add_generator_effect.
        texture_set:
          type: string
          minLength: 1
          maxLength: 256
        stack:
          type: string
          maxLength: 256
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/inspect_preset_parameters.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-success:
        - painter_presets__set_preset_parameters
        - painter_project__export_textures
      on-failure:
        - painter_project__list_layer_stack
  - name: set_preset_parameters
    description: >-
      Set bounded, JSON-safe parameters on an applied Painter preset instance by name and confirm each value by host readback. Idempotent. Reports which Painter parameter capabilities the running host exposes.
    input_schema:
      type: object
      additionalProperties: false
      required: [node_uid, parameters]
      properties:
        node_uid:
          type: integer
          minimum: 0
          description: UID of the applied preset node.
        parameters:
          type: object
          minProperties: 1
          maxProperties: 64
          description: >-
            Parameter name to value map. Each value is a boolean, integer, finite number, short string, or a flat vector of up to four such scalars. Validated before any host mutation.
        texture_set:
          type: string
          minLength: 1
          maxLength: 256
        stack:
          type: string
          maxLength: 256
    read_only: false
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/set_preset_parameters.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-success:
        - painter_presets__inspect_preset_parameters
        - painter_project__export_textures
      on-failure:
        - painter_presets__inspect_preset_parameters
        - painter_project__list_layer_stack
