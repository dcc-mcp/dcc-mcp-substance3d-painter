tools:
  - name: inspect_project
    description: Inspect the current Substance 3D Painter project and effective color-management state without modifying it.
    input_schema:
      type: object
      properties: {}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 15
    source_file: scripts/inspect_project.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
  - name: inspect_camera
    description: Inspect the default Painter camera position, rotation, field of view, and projection.
    input_schema:
      type: object
      properties: {}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 15
    source_file: scripts/inspect_camera.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
  - name: start_camera_orbit
    description: Start a timed camera orbit around an explicit scene-space center for look-development capture.
    input_schema:
      type: object
      required: [center, radius]
      properties:
        center:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
        radius:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          default: 0
        duration_seconds:
          type: number
          minimum: 1
          maximum: 180
          default: 10
        revolutions:
          type: number
          exclusiveMinimum: 0
          maximum: 4
          default: 1
        start_angle_degrees:
          type: number
          default: 0
        frames_per_second:
          type: integer
          minimum: 1
          maximum: 60
          default: 30
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/start_camera_orbit.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    next-tools:
      on-success:
        - painter_project__inspect_camera
      on-failure:
        - painter_project__inspect_camera
  - name: create_project
    description: Create a Painter project from a mesh with explicit template, UV workflow, resolution, and normal-map format.
    input_schema:
      type: object
      additionalProperties: false
      required: [mesh_path, project_path]
      properties:
        mesh_path:
          type: string
          description: Existing FBX, OBJ, DAE, PLY, or USD mesh path.
        project_path:
          type: string
          description: Target .spp path used as the default save path.
        resolution:
          type: integer
          enum: [128, 256, 512, 1024, 2048, 4096]
          default: 1024
        normal_map_format:
          type: string
          enum: [DirectX, OpenGL]
          default: DirectX
        template_path:
          type: string
          description: Optional existing Painter project template path.
        uv_workflow:
          type: string
          enum: [default, texture-set-per-uv-tile, uv-tile]
          default: default
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 300
    source_file: scripts/create_project.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
    next-tools:
      on-success:
        - painter_project__inspect_project
        - painter_project__list_texture_sets
      on-failure:
        - painter_project__inspect_project
  - name: open_project
    description: Open an existing saved Painter .spp project.
    input_schema:
      type: object
      required: [project_path]
      properties:
        project_path:
          type: string
          minLength: 5
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 300
    source_file: scripts/open_project.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    next-tools:
      on-success:
        - painter_project__inspect_project
      on-failure:
        - painter_project__inspect_project
  - name: close_project
    description: Close the active Painter project only when it has no unsaved changes.
    input_schema:
      type: object
      properties: {}
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 300
    source_file: scripts/close_project.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    next-tools:
      on-success:
        - painter_project__create_project
        - painter_project__open_project
      on-failure:
        - painter_project__save_project_as
        - painter_project__inspect_project
  - name: reload_mesh
    description: Reload an existing mesh into the open Painter project and verify the native callback plus mesh-path readback.
    input_schema:
      type: object
      additionalProperties: false
      required: [mesh_path]
      properties:
        mesh_path:
          type: string
          minLength: 1
          description: Existing FBX, OBJ, DAE, PLY, or USD mesh path.
        import_cameras:
          type: boolean
          default: true
        preserve_strokes:
          type: boolean
          default: true
    output_schema:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled, interrupted]
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
        context:
          type: object
          properties:
            mesh_path:
              type: string
            native_status:
              type: string
            import_cameras:
              type: boolean
            preserve_strokes:
              type: boolean
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    job_strategy: monolithic
    affinity: main
    timeout_hint_secs: 600
    source_file: scripts/reload_mesh.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-success:
        - painter_project__inspect_project
        - painter_project__list_texture_sets
      on-failure:
        - painter_project__inspect_project
  - name: list_texture_sets
    description: List texture sets and their active stack names without modifying the project.
    input_schema:
      type: object
      properties: {}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 15
    source_file: scripts/list_texture_sets.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
  - name: bake_mesh_maps
    description: >-
      Bake selected mesh maps for exactly one Painter texture set as a core-managed job.
      Returns immediately with a job ID; poll jobs_get_status for terminal status. Core
      cancellation is forwarded to Painter's native bake stop source, and success requires
      mesh-map resource plus texture-set resolution readback.
    input_schema:
      type: object
      required: [texture_set, maps]
      additionalProperties: false
      properties:
        texture_set:
          type: string
          minLength: 1
          maxLength: 256
          description: Exact name returned by painter_project__list_texture_sets.
        maps:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          description: Explicit bounded set of Painter mesh-map bakers to enable for this bake.
          items:
            type: string
            enum:
              - ambient_occlusion
              - curvature
              - id
              - normal
              - position
              - thickness
              - world_space_normal
    output_schema:
      type: object
      anyOf:
        - required: [job_id, status]
        - required: [success, message]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled, interrupted]
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
        prompt:
          type: string
        context:
          type: object
          properties:
            texture_set:
              type: string
            maps:
              type: array
              items:
                type: string
            native_status:
              type: string
            progress:
              type: number
              minimum: 0
              maximum: 1
            cancellation_supported:
              type: boolean
            cancellation_requested:
              type: boolean
            mesh_map_resources:
              type: object
              additionalProperties:
                type: string
            resolution:
              type: object
              required: [width, height]
              properties:
                width:
                  type: integer
                  minimum: 1
                height:
                  type: integer
                  minimum: 1
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    job_strategy: monolithic
    affinity: main
    timeout_hint_secs: 1800
    source_file: scripts/bake_mesh_maps.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-success:
        - painter_project__inspect_project
        - painter_project__list_texture_sets
        - painter_project__export_textures
      on-failure:
        - painter_project__inspect_project
        - painter_project__list_texture_sets
  - name: export_textures
    description: Export all current Painter texture sets using an explicit Painter export preset URL.
    input_schema:
      type: object
      required: [export_path, preset_url]
      properties:
        export_path:
          type: string
          description: Existing or creatable output directory for exported texture files.
        preset_url:
          type: string
          description: Painter export preset URL, for example a resource URL returned by Painter.
        padding_algorithm:
          type: string
          default: infinite
          description: Painter padding algorithm forwarded to the export parameters.
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 300
    source_file: scripts/export_textures.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    next-tools:
      on-failure:
        - painter_project__inspect_project
        - painter_project__list_texture_sets
        - painter_project__list_export_presets
  - name: list_export_presets
    description: List predefined and resource-backed Painter export presets with stable URLs.
    input_schema:
      type: object
      properties:
        query:
          type: string
          default: ""
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/list_export_presets.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
    next-tools:
      on-success:
        - painter_project__export_textures
  - name: save_project
    description: Save the active Painter project and confirm the host reports a clean saved state.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [incremental, full]
          default: incremental
    output_schema:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
        context:
          type: object
          properties:
            project_path:
              type: string
            needs_saving:
              type: boolean
            mode:
              type: string
              enum: [incremental, full]
    read_only: false
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 300
    source_file: scripts/save_project.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-success:
        - painter_project__inspect_project
        - painter_project__export_textures
      on-failure:
        - painter_project__inspect_project
        - painter_project__save_project_as
  - name: save_project_as
    description: Save the active Painter project to an explicit .spp path.
    input_schema:
      type: object
      required: [project_path]
      properties:
        project_path:
          type: string
          minLength: 5
    read_only: false
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 300
    source_file: scripts/save_project_as.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
    next-tools:
      on-success:
        - painter_project__export_textures
      on-failure:
        - painter_project__inspect_project
  - name: create_pbr_fill_layer
    description: Create a named fill layer with uniform Base Color, Metallic, and Roughness values.
    input_schema:
      type: object
      required: [name, base_color]
      properties:
        name:
          type: string
          minLength: 1
        base_color:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
            minimum: 0
            maximum: 1
        metallic:
          type: number
          minimum: 0
          maximum: 1
          default: 0
        roughness:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/create_pbr_fill_layer.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    next-tools:
      on-success:
        - painter_project__export_textures
      on-failure:
        - painter_project__inspect_project
  - name: create_textured_pbr_layer
    description: Import five standard PBR texture maps and bind them to a named fill layer.
    input_schema:
      type: object
      required:
        [name, base_color_path, normal_path, roughness_path, metallic_path, ambient_occlusion_path]
      properties:
        name:
          type: string
          minLength: 1
        base_color_path:
          type: string
        normal_path:
          type: string
        roughness_path:
          type: string
        metallic_path:
          type: string
        ambient_occlusion_path:
          type: string
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 120
    source_file: scripts/create_textured_pbr_layer.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    next-tools:
      on-success:
        - painter_project__save_project_as
        - painter_project__export_textures
      on-failure:
        - painter_project__inspect_project
  - name: search_resources
    description: Search Painter shelf, project, and session resources with an optional usage filter.
    input_schema:
      type: object
      properties:
        query:
          type: string
          default: ""
        usage:
          type: string
          description: Optional Painter Usage enum name, such as SMART_MATERIAL or EXPORT.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/search_resources.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
    next-tools:
      on-success:
        - painter_project__apply_smart_material
        - painter_project__export_textures
  - name: apply_smart_material
    description: Insert an existing Painter smart material resource into the active texture-set stack.
    input_schema:
      type: object
      required: [resource_url]
      properties:
        resource_url:
          type: string
          minLength: 1
        layer_name:
          type: string
          minLength: 1
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/apply_smart_material.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    next-tools:
      on-success:
        - painter_project__export_textures
      on-failure:
        - painter_project__search_resources
