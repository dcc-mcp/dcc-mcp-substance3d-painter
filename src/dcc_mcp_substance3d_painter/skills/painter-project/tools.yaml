tools:
  - name: inspect_project
    description: Inspect the current Substance 3D Painter project and effective color-management state without modifying it.
    input_schema:
      type: object
      properties: {}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 15
    source_file: scripts/inspect_project.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
  - name: inspect_camera
    description: Inspect the default Painter camera position, rotation, field of view, and projection.
    input_schema:
      type: object
      properties: {}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 15
    source_file: scripts/inspect_camera.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
  - name: execute_materialized_script
    description: >-
      Execute one unchanged Python FileRef returned by Core materialize_script.
      Inline source, caller paths, alternate modes, links, replaced files, and non-portable or over-budget complete public JSON responses are rejected.
      A FileRef proves identity and freshness, not source trust; this same-process tool is not a Python security sandbox and accepts only source trusted to run with Painter privileges. The full FileRef contract is rechecked immediately before main-thread dispatch; a host callable captured before source invokes the validated entrypoint, its strict result is snapshotted when valid, and suffix source executes exactly once after every source-entered main attempt in a quarantined side-effect phase. Direct JSON imports are request-private, and executor imports expose only a minimal request facade with private JSON and no executor callables or canonical state. Canonical host cancellation, validator, and JSON serializer state are restored after each request. Suffix failures do not clobber the main outcome. Suffix-only main dependencies fail closed with script_suffix_dependency.
    input_schema:
      type: object
      additionalProperties: false
      required: [file_ref]
      properties:
        file_ref:
          type: object
          additionalProperties: false
          required: [uri, mime, size_bytes, display_name, digest, tool_call_id, session_id, correlation_id, created_at, expires_at, metadata]
          properties:
            uri:
              type: string
              pattern: '^file:///'
            mime:
              const: text/x-python
            size_bytes:
              type: integer
              minimum: 1
              maximum: 1048576
            display_name:
              type: string
              pattern: '^[A-Za-z0-9_.-]+\.py$'
            digest:
              type: string
              pattern: '^sha256:[0-9a-f]{64}$'
            tool_call_id:
              type: [string, 'null']
            session_id:
              type: string
              minLength: 1
            correlation_id:
              type: [string, 'null']
            created_at:
              type: string
            expires_at:
              type: [string, 'null']
            metadata:
              type: object
              additionalProperties: false
              required: [dcc_type, instance_id, session_id, script_id, language, suffix, materialization_kind]
              properties:
                dcc_type:
                  const: substance3d_painter
                instance_id:
                  type: string
                  minLength: 1
                session_id:
                  type: string
                  minLength: 1
                script_id:
                  type: string
                  minLength: 1
                language:
                  const: python
                suffix:
                  const: .py
                materialization_kind:
                  const: script
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 120
    source_file: scripts/execute_materialized_script.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
  - name: start_camera_orbit
    description: Start a timed camera orbit around an explicit scene-space center for look-development capture.
    input_schema:
      type: object
      required: [center, radius]
      properties:
        center:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
        radius:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          default: 0
        duration_seconds:
          type: number
          minimum: 1
          maximum: 180
          default: 10
        revolutions:
          type: number
          exclusiveMinimum: 0
          maximum: 4
          default: 1
        start_angle_degrees:
          type: number
          default: 0
        frames_per_second:
          type: integer
          minimum: 1
          maximum: 60
          default: 30
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/start_camera_orbit.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    next-tools:
      on-success:
        - painter_project__inspect_camera
      on-failure:
        - painter_project__inspect_camera
  - name: create_project
    description: Create a Painter project from a mesh with explicit template, UV workflow, resolution, and normal-map format.
    input_schema:
      type: object
      additionalProperties: false
      required: [mesh_path, project_path]
      properties:
        mesh_path:
          type: string
          description: Existing FBX, OBJ, DAE, PLY, or USD mesh path.
        project_path:
          type: string
          description: Target .spp path used as the default save path.
        resolution:
          type: integer
          enum: [128, 256, 512, 1024, 2048, 4096]
          default: 1024
        normal_map_format:
          type: string
          enum: [DirectX, OpenGL]
          default: DirectX
        template_path:
          type: string
          description: Optional existing Painter project template path.
        uv_workflow:
          type: string
          enum: [default, texture-set-per-uv-tile, uv-tile]
          default: default
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 300
    source_file: scripts/create_project.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
    next-tools:
      on-success:
        - painter_project__inspect_project
        - painter_project__list_texture_sets
      on-failure:
        - painter_project__inspect_project
  - name: open_project
    description: Open an existing saved Painter .spp project.
    input_schema:
      type: object
      required: [project_path]
      properties:
        project_path:
          type: string
          minLength: 5
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 300
    source_file: scripts/open_project.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    next-tools:
      on-success:
        - painter_project__inspect_project
      on-failure:
        - painter_project__inspect_project
  - name: close_project
    description: Close the active Painter project only when it has no unsaved changes.
    input_schema:
      type: object
      properties: {}
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 300
    source_file: scripts/close_project.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    next-tools:
      on-success:
        - painter_project__create_project
        - painter_project__open_project
      on-failure:
        - painter_project__save_project_as
        - painter_project__inspect_project
  - name: reload_mesh
    description: Reload an existing mesh into the open Painter project and verify the native callback plus mesh-path readback.
    input_schema:
      type: object
      additionalProperties: false
      required: [mesh_path]
      properties:
        mesh_path:
          type: string
          minLength: 1
          description: Existing FBX, OBJ, DAE, PLY, or USD mesh path.
        import_cameras:
          type: boolean
          default: true
        preserve_strokes:
          type: boolean
          default: true
    output_schema:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled, interrupted]
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
        context:
          type: object
          properties:
            mesh_path:
              type: string
            native_status:
              type: string
            import_cameras:
              type: boolean
            preserve_strokes:
              type: boolean
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    job_strategy: monolithic
    affinity: main
    timeout_hint_secs: 600
    source_file: scripts/reload_mesh.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-success:
        - painter_project__inspect_project
        - painter_project__list_texture_sets
      on-failure:
        - painter_project__inspect_project
  - name: list_texture_sets
    description: List texture sets and their active stack names without modifying the project.
    input_schema:
      type: object
      properties: {}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 15
    source_file: scripts/list_texture_sets.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
  - name: bake_mesh_maps
    description: >-
      Bake selected mesh maps for exactly one Painter texture set as a core-managed job.
      Returns immediately with a job ID; poll jobs_get_status for terminal status. Core
      cancellation is forwarded to Painter's native bake stop source, and success requires
      mesh-map resource plus texture-set resolution readback.
    input_schema:
      type: object
      required: [texture_set, maps]
      additionalProperties: false
      properties:
        texture_set:
          type: string
          minLength: 1
          maxLength: 256
          description: Exact name returned by painter_project__list_texture_sets.
        maps:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          description: Explicit bounded set of Painter mesh-map bakers to enable for this bake.
          items:
            type: string
            enum:
              - ambient_occlusion
              - curvature
              - id
              - normal
              - position
              - thickness
              - world_space_normal
    output_schema:
      type: object
      anyOf:
        - required: [job_id, status]
        - required: [success, message]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled, interrupted]
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
        prompt:
          type: string
        context:
          type: object
          properties:
            texture_set:
              type: string
            maps:
              type: array
              items:
                type: string
            native_status:
              type: string
            progress:
              type: number
              minimum: 0
              maximum: 1
            cancellation_supported:
              type: boolean
            cancellation_requested:
              type: boolean
            mesh_map_resources:
              type: object
              additionalProperties:
                type: string
            resolution:
              type: object
              required: [width, height]
              properties:
                width:
                  type: integer
                  minimum: 1
                height:
                  type: integer
                  minimum: 1
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    job_strategy: monolithic
    affinity: main
    timeout_hint_secs: 1800
    source_file: scripts/bake_mesh_maps.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-success:
        - painter_project__inspect_project
        - painter_project__list_texture_sets
        - painter_project__export_textures
      on-failure:
        - painter_project__inspect_project
        - painter_project__list_texture_sets
  - name: create_export_preset
    description: Build a bounded inline PNG export preset with explicit non-overlapping document-map channel routing.
    input_schema:
      type: object
      additionalProperties: false
      required: [name, maps]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z][A-Za-z0-9_-]*$"
        maps:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [file_name, channels]
            properties:
              file_name:
                type: string
                minLength: 1
                maxLength: 128
              channels:
                type: array
                minItems: 1
                maxItems: 4
                description: Destination assignments must be non-overlapping; RGB and RGB+A must each be the sole destination.
                items:
                  type: object
                  additionalProperties: false
                  required: [destination, source_channel, source_map]
                  properties:
                    destination:
                      type: string
                      enum: [R, G, B, A, RGB, RGB+A]
                    source_channel:
                      type: string
                      enum: [R, G, B, A, RGB, RGB+A]
                    source_map:
                      type: string
                      minLength: 1
                      maxLength: 64
        bit_depth:
          type: integer
          enum: [8, 16]
          default: 8
        dithering:
          type: boolean
          default: false
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 15
    source_file: scripts/create_export_preset.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-success:
        - painter_project__export_textures
  - name: export_textures
    description: Selectively export Painter texture sets and verify returned files, with strict PNG resolution readback for inline presets.
    input_schema:
      type: object
      additionalProperties: false
      required: [export_path]
      oneOf:
        - required: [preset_url]
        - required: [preset]
      properties:
        export_path:
          type: string
          description: Existing or creatable output directory for exported texture files.
        preset_url:
          type: string
          minLength: 1
          description: Painter export preset URL, for example a resource URL returned by Painter.
        preset:
          type: object
          additionalProperties: false
          required: [name, maps]
          description: Exact bounded object returned by painter_project__create_export_preset.
          properties:
            name:
              type: string
            maps:
              type: array
              minItems: 1
              maxItems: 32
              items:
                type: object
                additionalProperties: false
                required: [fileName, channels, parameters]
                properties:
                  fileName:
                    type: string
                  channels:
                    type: array
                    minItems: 1
                    maxItems: 4
                    items:
                      type: object
                      additionalProperties: false
                      required: [destChannel, srcChannel, srcMapType, srcMapName]
                      properties:
                        destChannel:
                          type: string
                          enum: [R, G, B, A, RGB, RGB+A]
                        srcChannel:
                          type: string
                          enum: [R, G, B, A, RGB, RGB+A]
                        srcMapType:
                          type: string
                          const: documentMap
                        srcMapName:
                          type: string
                  parameters:
                    type: object
                    additionalProperties: false
                    required: [fileFormat, bitDepth, dithering]
                    properties:
                      fileFormat:
                        type: string
                        const: png
                      bitDepth:
                        type: string
                        enum: ["8", "16"]
                      dithering:
                        type: boolean
        texture_sets:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
        padding_algorithm:
          type: string
          enum: [infinite, dilation, passthrough]
          default: infinite
          description: Painter padding algorithm forwarded to the export parameters.
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 300
    source_file: scripts/export_textures.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    next-tools:
      on-failure:
        - painter_project__inspect_project
        - painter_project__list_texture_sets
        - painter_project__list_export_presets
  - name: list_export_presets
    description: List predefined and resource-backed Painter export presets with stable URLs.
    input_schema:
      type: object
      properties:
        query:
          type: string
          default: ""
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/list_export_presets.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
    next-tools:
      on-success:
        - painter_project__export_textures
  - name: save_project
    description: Save the active Painter project and confirm the host reports a clean saved state.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [incremental, full]
          default: incremental
    output_schema:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
        context:
          type: object
          properties:
            project_path:
              type: string
            needs_saving:
              type: boolean
            mode:
              type: string
              enum: [incremental, full]
    read_only: false
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 300
    source_file: scripts/save_project.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-success:
        - painter_project__inspect_project
        - painter_project__export_textures
      on-failure:
        - painter_project__inspect_project
        - painter_project__save_project_as
  - name: save_project_as
    description: Save the active Painter project to an explicit .spp path.
    input_schema:
      type: object
      required: [project_path]
      properties:
        project_path:
          type: string
          minLength: 5
    read_only: false
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 300
    source_file: scripts/save_project_as.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
    next-tools:
      on-success:
        - painter_project__export_textures
      on-failure:
        - painter_project__inspect_project
  - name: list_layer_stack
    description: Read one Painter layer stack as a full tree of layers, masks, and effects for before/after assertions.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        texture_set:
          type: string
          minLength: 1
          maxLength: 256
        stack:
          type: string
          maxLength: 256
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/list_layer_stack.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
  - name: insert_paint_layer
    description: Insert a named Painter paint layer at a bounded position and require same-stack host readback.
    input_schema:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        placement:
          type: string
          enum: [top, above, below, inside]
          default: top
        relative_to_uid:
          type: integer
          minimum: 0
        texture_set:
          type: string
          minLength: 1
          maxLength: 256
        stack:
          type: string
          maxLength: 256
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/insert_paint_layer.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
    next-tools:
      on-success:
        - painter_project__list_layer_stack
      on-failure:
        - painter_project__list_layer_stack
  - name: add_mask
    description: Add a black, white, or resource-backed smart mask to exactly one Painter layer and verify it by readback.
    input_schema:
      type: object
      additionalProperties: false
      required: [layer_uid, kind]
      properties:
        layer_uid:
          type: integer
          minimum: 0
        kind:
          type: string
          enum: [black, white, smart]
        resource_url:
          type: string
          minLength: 1
          maxLength: 2048
        texture_set:
          type: string
          minLength: 1
          maxLength: 256
        stack:
          type: string
          maxLength: 256
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/add_mask.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
    next-tools:
      on-success:
        - painter_project__list_layer_stack
      on-failure:
        - painter_project__list_layer_stack
        - painter_project__search_resources
  - name: add_generator_effect
    description: Insert an existing generator resource into a layer content or mask effect stack and verify its source by readback.
    input_schema:
      type: object
      additionalProperties: false
      required: [target_uid, target_stack, resource_url]
      properties:
        target_uid:
          type: integer
          minimum: 0
        target_stack:
          type: string
          enum: [content, mask]
        resource_url:
          type: string
          minLength: 1
          maxLength: 2048
        texture_set:
          type: string
          minLength: 1
          maxLength: 256
        stack:
          type: string
          maxLength: 256
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/add_generator_effect.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
    next-tools:
      on-success:
        - painter_project__list_layer_stack
      on-failure:
        - painter_project__list_layer_stack
        - painter_project__search_resources
  - name: import_resource
    description: Import one bounded resource file into the open Painter project and require catalog readback before success.
    input_schema:
      type: object
      additionalProperties: false
      required: [file_path, usage]
      properties:
        file_path:
          type: string
          minLength: 1
          description: Regular non-link file of at most 512 MiB whose extension matches the selected usage.
        usage:
          type: string
          enum: [alpha, environment, export, generator, smart_mask, smart_material, texture]
          description: "Painter resource family: raster images for alpha/texture, HDR/EXR for environment, .sbsar generator, .spsm smart material, .spmsk smart mask, or .spexp export preset."
        name:
          type: string
          minLength: 1
          maxLength: 128
        group:
          type: string
          minLength: 1
          maxLength: 128
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 120
    source_file: scripts/import_resource.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
    next-tools:
      on-success:
        - painter_project__search_resources
        - painter_project__add_mask
        - painter_project__add_generator_effect
      on-failure:
        - painter_project__search_resources
  - name: create_pbr_fill_layer
    description: Create a named fill layer with uniform Base Color, Metallic, and Roughness values.
    input_schema:
      type: object
      additionalProperties: false
      required: [name, base_color]
      properties:
        name:
          type: string
          minLength: 1
        base_color:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
            minimum: 0
            maximum: 1
        metallic:
          type: number
          minimum: 0
          maximum: 1
          default: 0
        roughness:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
    read_only: false
    destructive: false
    idempotent: false
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/create_pbr_fill_layer.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    next-tools:
      on-success:
        - painter_project__export_textures
      on-failure:
        - painter_project__inspect_project
  - name: create_textured_pbr_layer
    description: Import five standard PBR texture maps and bind them to a named fill layer.
    input_schema:
      type: object
      required:
