tools:
  - name: ping
    description: Prove that Painter's main-thread bridge can execute a fresh read-only request.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema:
      type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        prompt: {type: [string, "null"]}
        error: {type: [string, "null"]}
        context:
          type: object
          required: [host_dispatch_ready, host]
          properties:
            host_dispatch_ready: {type: boolean, const: true}
            host: {type: string, const: substance3d_painter}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    source_file: scripts/ping.py
    next-tools:
      on-failure: [dcc_diagnostics__audit_log]
