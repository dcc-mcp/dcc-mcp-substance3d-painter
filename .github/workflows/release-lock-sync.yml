name: Release lock sync

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - ".release-please-manifest.json"
      - "pyproject.toml"
      - "src/dcc_mcp_substance3d_painter/__version__.py"
      - "uv.lock"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-release-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release-please--branches--main--components--dcc-mcp-substance3d-painter' &&
      startsWith(github.event.pull_request.title, 'chore(main): release ')
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: false
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install pinned uv
        run: timeout --signal=TERM --kill-after=10s 300s python -m pip install "uv==0.11.19"
      - name: Validate exact release PR lease
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/remote-head.txt" "$RUNNER_TEMP/remote-base.txt" "$RUNNER_TEMP/release-paths.txt"' EXIT
          test "$HEAD_REF" = "release-please--branches--main--components--dcc-mcp-substance3d-painter"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          timeout --signal=TERM --kill-after=10s 60s git ls-remote --exit-code --heads origin \
            "refs/heads/$HEAD_REF" > "$RUNNER_TEMP/remote-head.txt"
          timeout --signal=TERM --kill-after=10s 60s git ls-remote --exit-code --heads origin \
            refs/heads/main > "$RUNNER_TEMP/remote-base.txt"
          remote_head="$(awk 'NR == 1 {print $1}' "$RUNNER_TEMP/remote-head.txt")"
          remote_base="$(awk 'NR == 1 {print $1}' "$RUNNER_TEMP/remote-base.txt")"
          test "$remote_head" = "$EXPECTED_HEAD_SHA"
          test "$remote_base" = "$EXPECTED_BASE_SHA"
          timeout --signal=TERM --kill-after=10s 60s git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/release-lock-base"
          test "$(git rev-parse refs/remotes/origin/release-lock-base)" = "$EXPECTED_BASE_SHA"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git diff --name-only "$EXPECTED_BASE_SHA...HEAD" > "$RUNNER_TEMP/release-paths.txt"
          timeout --signal=TERM --kill-after=10s 60s python -B tools/release_integrity.py \
            verify-release-paths --paths "$RUNNER_TEMP/release-paths.txt"
          timeout --signal=TERM --kill-after=10s 60s python -B tools/release_integrity.py \
            verify-version-anchors --root .
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Synchronize root uv.lock
        run: timeout --signal=TERM --kill-after=10s 180s uv lock
      - name: Verify only reviewed lock change
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/lock-status.txt"' EXIT
          timeout --signal=TERM --kill-after=10s 60s python -B tools/release_integrity.py \
            verify-version-anchors --root . --require-lock
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/lock-status.txt"
          timeout --signal=TERM --kill-after=10s 60s python -B tools/release_integrity.py \
            verify-lock-status --status "$RUNNER_TEMP/lock-status.txt"
      - name: Commit and push exact uv.lock
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already synchronized."
            exit 0
          fi
          trap 'rm -f "$RUNNER_TEMP/release-version.txt" "$RUNNER_TEMP/open-release-pr.json" "$RUNNER_TEMP/release-pr-detail.json" "$RUNNER_TEMP/release-pr-files.json" "$RUNNER_TEMP/remote-head-before-push.txt" "$RUNNER_TEMP/remote-base-before-push.txt"' EXIT
          timeout --signal=TERM --kill-after=10s 60s python -B tools/release_integrity.py \
            verify-version-anchors --root . --require-lock > "$RUNNER_TEMP/release-version.txt"
          read -r version < "$RUNNER_TEMP/release-version.txt"
          timeout --signal=TERM --kill-after=10s 60s git ls-remote --exit-code --heads origin \
            "refs/heads/$HEAD_REF" > "$RUNNER_TEMP/remote-head-before-push.txt"
          timeout --signal=TERM --kill-after=10s 60s git ls-remote --exit-code --heads origin \
            refs/heads/main > "$RUNNER_TEMP/remote-base-before-push.txt"
          remote_head="$(awk 'NR == 1 {print $1}' "$RUNNER_TEMP/remote-head-before-push.txt")"
          remote_base="$(awk 'NR == 1 {print $1}' "$RUNNER_TEMP/remote-base-before-push.txt")"
          test "$remote_head" = "$EXPECTED_HEAD_SHA"
          test "$remote_base" = "$EXPECTED_BASE_SHA"
          timeout --signal=TERM --kill-after=10s 60s gh api \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&head=${GITHUB_REPOSITORY_OWNER}:${HEAD_REF}&per_page=100" \
            > "$RUNNER_TEMP/open-release-pr.json"
          timeout --signal=TERM --kill-after=10s 60s gh api \
            "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR_NUMBER" \
            > "$RUNNER_TEMP/release-pr-detail.json"
          timeout --signal=TERM --kill-after=10s 60s gh api \
            "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR_NUMBER/files?per_page=100" \
            > "$RUNNER_TEMP/release-pr-files.json"
          timeout --signal=TERM --kill-after=10s 60s python -B tools/release_integrity.py verify-release-pr \
            --metadata "$RUNNER_TEMP/open-release-pr.json" \
            --detail "$RUNNER_TEMP/release-pr-detail.json" \
            --files "$RUNNER_TEMP/release-pr-files.json" \
            --expected-number "$EXPECTED_PR_NUMBER" --expected-version "$version" \
            --expected-base-sha "$EXPECTED_BASE_SHA" --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-head-ref "$HEAD_REF" --expected-repository "$GITHUB_REPOSITORY"
          test "$(git status --porcelain=v1 --untracked-files=all)" = " M uv.lock"
          git config user.name "loonghao"
          git config user.email "hal.long@outlook.com"
          git add -- uv.lock
          test "$(git diff --cached --name-only)" = "uv.lock"
          git diff --quiet
          git commit -m "chore(ci): sync release lock"
          timeout --signal=TERM --kill-after=10s 60s git push \
            --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD_SHA}" \
            origin "HEAD:refs/heads/${HEAD_REF}"
