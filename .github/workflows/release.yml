name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created == 'true' }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release-artifact:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.release-please.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Verify release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.release-please.outputs.source_sha }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,assets \
            > "$RUNNER_TEMP/release-before-build.json"
          python -B tools/release_integrity.py verify-source \
            --head-sha "$(git rev-parse HEAD)" \
            --tag-sha "$(git rev-parse "${TAG_NAME}^{commit}")" \
            --release-target "$(jq -r .targetCommitish "$RUNNER_TEMP/release-before-build.json")" \
            --expected-sha "$SOURCE_SHA" --tag-name "$TAG_NAME" --version "$VERSION"
          python -B tools/release_integrity.py verify-release-target \
            --metadata "$RUNNER_TEMP/release-before-build.json" \
            --expected-tag "$TAG_NAME" --expected-source-sha "$SOURCE_SHA" \
            --require-empty-assets
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions once
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Stage exact distribution bundle
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-bundle
          mv dist release-bundle/dist
          python -B tools/release_integrity.py write-checksums \
            --directory release-bundle --version "$VERSION"
          python -B tools/release_integrity.py verify-bundle \
            --directory release-bundle --version "$VERSION"
      - name: Upload immutable release artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-distributions
          path: release-bundle
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    needs: [release-please, build-release-artifact]
    if: needs.release-please.outputs.release_created == 'true' && needs.build-release-artifact.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-substance3d-painter
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.release-please.outputs.source_sha }}
      - name: Download verified release artifact
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build-release-artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build-release-artifact.outputs.artifact_digest }}
          SOURCE_SHA: ${{ needs.release-please.outputs.source_sha }}
          VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          python -B tools/release_integrity.py verify-artifact \
            --metadata "$RUNNER_TEMP/artifact.json" --expected-id "$ARTIFACT_ID" \
            --expected-digest "$ARTIFACT_DIGEST" --expected-name release-distributions \
            --expected-run-id "$GITHUB_RUN_ID" --expected-head-sha "$SOURCE_SHA" \
            --expected-repository "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/artifact.zip"
          python -B tools/release_integrity.py verify-extract \
            --archive "$RUNNER_TEMP/artifact.zip" --expected-digest "$ARTIFACT_DIGEST" \
            --output release-bundle
          python -B tools/release_integrity.py verify-bundle \
            --directory release-bundle --version "$VERSION"
      - name: Re-fetch and verify before PyPI upload
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build-release-artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build-release-artifact.outputs.artifact_digest }}
          SOURCE_SHA: ${{ needs.release-please.outputs.source_sha }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact-before-pypi.json"
          python -B tools/release_integrity.py verify-artifact \
            --metadata "$RUNNER_TEMP/artifact-before-pypi.json" --expected-id "$ARTIFACT_ID" \
            --expected-digest "$ARTIFACT_DIGEST" --expected-name release-distributions \
            --expected-run-id "$GITHUB_RUN_ID" --expected-head-sha "$SOURCE_SHA" \
            --expected-repository "$GITHUB_REPOSITORY"
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,assets \
            > "$RUNNER_TEMP/release-before-pypi.json"
          python -B tools/release_integrity.py verify-release-target \
            --metadata "$RUNNER_TEMP/release-before-pypi.json" \
            --expected-tag "$TAG_NAME" --expected-source-sha "$SOURCE_SHA" \
            --require-empty-assets
          python -B tools/release_integrity.py verify-bundle \
            --directory release-bundle --version "$VERSION"
      - name: Upload verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: release-bundle/dist
          verbose: true
          print-hash: true

  attach-github-assets:
    needs: [release-please, build-release-artifact, publish-pypi]
    if: needs.release-please.outputs.release_created == 'true' && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.release-please.outputs.source_sha }}
      - name: Download verified release artifact
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build-release-artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build-release-artifact.outputs.artifact_digest }}
          SOURCE_SHA: ${{ needs.release-please.outputs.source_sha }}
          VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          python -B tools/release_integrity.py verify-artifact \
            --metadata "$RUNNER_TEMP/artifact.json" --expected-id "$ARTIFACT_ID" \
            --expected-digest "$ARTIFACT_DIGEST" --expected-name release-distributions \
            --expected-run-id "$GITHUB_RUN_ID" --expected-head-sha "$SOURCE_SHA" \
            --expected-repository "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/artifact.zip"
          python -B tools/release_integrity.py verify-extract \
            --archive "$RUNNER_TEMP/artifact.zip" --expected-digest "$ARTIFACT_DIGEST" \
            --output release-bundle
          python -B tools/release_integrity.py verify-bundle \
            --directory release-bundle --version "$VERSION"
      - name: Re-fetch and verify before GitHub upload
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build-release-artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build-release-artifact.outputs.artifact_digest }}
          SOURCE_SHA: ${{ needs.release-please.outputs.source_sha }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact-before-github.json"
          python -B tools/release_integrity.py verify-artifact \
            --metadata "$RUNNER_TEMP/artifact-before-github.json" --expected-id "$ARTIFACT_ID" \
            --expected-digest "$ARTIFACT_DIGEST" --expected-name release-distributions \
            --expected-run-id "$GITHUB_RUN_ID" --expected-head-sha "$SOURCE_SHA" \
            --expected-repository "$GITHUB_REPOSITORY"
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,assets \
            > "$RUNNER_TEMP/release-before-github.json"
          python -B tools/release_integrity.py verify-release-target \
            --metadata "$RUNNER_TEMP/release-before-github.json" \
            --expected-tag "$TAG_NAME" --expected-source-sha "$SOURCE_SHA" \
            --require-empty-assets
          python -B tools/release_integrity.py verify-bundle \
            --directory release-bundle --version "$VERSION"
      - name: Upload GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: >-
          gh release upload "$TAG_NAME"
          release-bundle/dist/* release-bundle/SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
      - name: Verify published GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.release-please.outputs.source_sha }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,assets \
            > "$RUNNER_TEMP/release-after-github.json"
          python -B tools/release_integrity.py verify-published-release \
            --metadata "$RUNNER_TEMP/release-after-github.json" \
            --directory release-bundle --version "$VERSION" \
            --expected-tag "$TAG_NAME" --expected-source-sha "$SOURCE_SHA"
