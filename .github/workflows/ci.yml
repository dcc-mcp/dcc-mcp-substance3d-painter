name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "release-please--branches--**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DCC_MCP_GATEWAY_PORT: "0"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      DCC_MCP_REGISTRY_DIR: ${{ github.workspace }}/.tmp/dcc-mcp-registry
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.9"
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" "dcc-mcp-core==0.20.15"
      - name: Install lifecycle smoke
        run: python -m pytest tests/test_install_lifecycle.py
      - run: python -m pytest
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      DCC_MCP_REGISTRY_DIR: ${{ github.workspace }}/.tmp/dcc-mcp-registry
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" "dcc-mcp-core==0.20.15" "uv==0.11.19"
      - run: uv lock --check
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: python tools/lint_skills.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/verify_wheel.py $(find dist -name '*.whl' -print -quit)
      - name: Installed-wheel contract smoke
        run: |
          python -m venv "${{ runner.temp }}/wheel-smoke"
          "${{ runner.temp }}/wheel-smoke/bin/python" -m pip install --upgrade pip
          "${{ runner.temp }}/wheel-smoke/bin/python" -m pip install "dcc-mcp-core==0.20.15" "jsonschema>=4.23" dist/*.whl
          cd "${{ runner.temp }}"
          wheel-smoke/bin/python "$GITHUB_WORKSPACE/tools/wheel_smoke.py"

  process-boundary:
    runs-on: ${{ matrix.os }}
    env:
      DCC_MCP_REGISTRY_DIR: ${{ github.workspace }}/.tmp/dcc-mcp-registry
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" "dcc-mcp-core==0.20.15"
      - name: Interpreter process-tree timeout ownership
        run: python -m pytest tests/test_install_hardening.py -k interpreter_probe_timeout
